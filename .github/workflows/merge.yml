name: Agent Merge
run-name: "merge #${{ inputs.issue }} r0"
# Coordinator, not an agent: re-runs the checks, squash-merges a verified agent PR into
# main, closes the issue, and starts the planner on the oldest `agent-queue` issue.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number whose verified PR to merge
        required: true
        type: string
permissions: {}
concurrency:
  group: agent-merge
  cancel-in-progress: false
jobs:
  merge:
    if: vars.AGENTS_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ inputs.issue }}
    steps:
      - name: Find the PR and refuse files reserved for the human
        id: pr
        run: |
          pr=$(gh pr list --head "agent/issue-$ISSUE" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then echo "::error::No open PR for agent/issue-$ISSUE"; exit 1; fi
          reserved=$(gh pr diff "$pr" --name-only | grep -E '^(\.github/|AGENTS\.md$|PROJECT\.md$)' || true)
          if [ -n "$reserved" ]; then
            gh issue comment "$ISSUE" --body "<!-- agent-loop role=coordinator stage=merge round=0 verdict=blocked -->
          ### Merge held for the human
          PR #$pr touches files only the human may merge:
          \`\`\`
          $reserved
          \`\`\`"
            gh issue edit "$ISSUE" --add-label agent-blocked
            exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: agent/issue-${{ inputs.issue }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run smoke
      - name: Squash-merge and close the issue
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          gh pr merge "$PR" --squash --delete-branch
          gh issue comment "$ISSUE" --body "<!-- agent-loop role=coordinator stage=merge round=0 verdict=merged -->
          ### Merged
          PR #$PR passed review, verification, and a fresh \`npm test\` and \`npm run smoke\`, and is now on \`main\`."
          gh issue close "$ISSUE" --reason completed || true
      - name: Start the next queued issue
        run: |
          next=$(gh issue list --label agent-queue --state open --json number --jq 'sort_by(.number) | .[0].number')
          if [ -z "$next" ]; then echo "Queue empty" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          gh issue edit "$next" --remove-label agent-queue --add-label agent
          gh workflow run planner.lock.yml -f issue="$next" -f round=1
          echo "Started planner for #$next" >> "$GITHUB_STEP_SUMMARY"
